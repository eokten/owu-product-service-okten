<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Product Image Uploaded</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color: #f6f7fb; margin:0; padding:0;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:20px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="padding:24px; text-align:center; background:#3b82f6; color:white;">
                        <img src="cid:logo" alt="logo" width="120" height="120", style="display:block; margin:0 auto;" />
                        <h1 style="margin:0;">New Product Image Uploaded</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px; font-size:15px; color:#111827;">
                        <p>Hello,</p>
                        <p>A new product image has just been uploaded:</p>

                        <table role="presentation" cellpadding="8" cellspacing="0" border="0"
                               style="width:100%; border-collapse:collapse; margin-top:12px;">
                            <tr style="background-color:#f3f4f6;">
                                <td style="font-weight:bold; width:150px;">Product Name:</td>
                                <td th:text="${productName}">Sample Product</td>
                            </tr>
                        </table>

                        <p style="margin-top:20px;">You can view it in the system for more details.</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px; background:#f3f4f6; font-size:12px; color:#6b7280; text-align:center;">
                        <p>&copy; 2025 MyCompany. All rights reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
